b) Calculate the ideal operating time.
c) Calculate the average battery current.
d) Determine the approximate C-rate.

    answer:

E = V × Ah
E = 44.4 × 16
E = 710.4 Wh

b) Operating time:

t = E / P
t = 710.4 / 532.8
t = 1.33 h

c) Average battery current:

I = P / V
I = 532.8 / 44.4
I = 12 A

d) C-rate:

C-rate = Current / Capacity
= 12 / 16
= 0.75 C

e) Important parameters:
- Energy density
- Power density
- Capacity
- C-rate
- Voltage
- Weight
- Cycle life
- Safety
- Thermal performance
- Charging characteristics.`,

    `Explain the classification of power converters used in robotic electrical power systems. Discuss the selection of MOSFET and IGBT devices considering voltage rating, current rating, switching frequency, conduction loss, switching loss and thermal requirements. Also explain EMI/EMC considerations.`,

    answer:
    `Power converters can be classified as:

1. AC-DC converters
2. DC-DC converters
3. DC-AC converters
4. AC-AC converters

Converter selection depends on input/output voltage, power rating, efficiency, isolation, switching frequency, size, cost and control requirements.

MOSFETs are generally preferred for high-frequency and low-to-medium voltage applications because of their fast switching capability and low conduction resistance.

IGBTs are suitable for higher voltage and higher power applications where switching frequency requirements are moderate.

Conduction loss and switching loss must be considered.

Thermal design includes heat sinks, thermal interface materials and adequate cooling.

EMI/EMC can be improved using proper PCB layout, short current paths, shielding, filtering, grounding, snubbers and controlled switching transitions.`,

    keywords:
    [
        "AC-DC",
        "DC-DC",
        "DC-AC",
        "AC-AC",
        "MOSFET",
        "IGBT",
        "voltage",
        "current",

        "conduction loss",
        "switching loss",
        "thermal",

        "EMC",
        "filtering",
        "grounding",
        "PCB layout"

},

    id: 13,

    question:
    `Design an ideal buck converter for a robotic controller supply with:

Input voltage = 54 V
Output voltage = 18 V
Output current = 5 A
Switching frequency = 75 kHz

Assume the inductor current ripple is 25% of output current and output voltage ripple is limited to 1% of output voltage.

Calculate:
a) Output power
b) Duty ratio
c) Inductor ripple current
d) Inductance
e) Output voltage ripple
f) Approximate output capacitance.`,

    answer:
    `Given:

Vin = 54 V
Vo = 18 V
Io = 5 A
fs = 75 kHz

a) Output power:

Po = Vo × Io
= 18 × 5
= 90 W

b) Duty ratio:

D = Vo / Vin
= 18 / 54
= 0.3333
= 33.33%

c) Inductor ripple:

ΔIL = 25% × Io
= 0.25 × 5
= 1.25 A

d) Inductance:

L = [(Vin - Vo)D] / (fs × ΔIL)

L = [(54 - 18) × 0.3333] /
    (75000 × 1.25)

L ≈ 128 µH

e) Voltage ripple:

ΔVo = 1% × 18
= 0.18 V

f) Approximate capacitance:

C = ΔIL / (8 fs ΔVo)

C = 1.25 /
    (8 × 75000 × 0.18)

C ≈ 11.57 µF

Therefore, a practical design may select a capacitor greater than this calculated value after considering ESR and transient requirements.`,

Power semiconductor switches such as MOSFETs or IGBTs are selected according to voltage, current, switching frequency and losses.

Current control regulates charging/discharging current.

Important protections include over-current, over-voltage, under-voltage, over-temperature, short-circuit protection and battery protection.

{

The outer position loop compares the commanded position with the measured position from the encoder.

The position controller generates a speed reference.

The speed loop compares the speed reference with measured speed and generates a torque/current reference.

The inner current or torque loop controls motor current and electromagnetic torque.

An encoder provides accurate rotor position and speed feedback.

A PWM inverter generates the required motor voltage by controlling semiconductor switches.

Cascade control improves dynamic response, disturbance rejection and current limiting. The inner current loop is faster than the speed loop, while the position loop is normally the slowest.`,

The analog voltage is converted into digital data using the ADC.

The measured voltage is compared with the reference to generate the error.

The PI controller processes the error and generates the control command.

The command is converted into a suitable PWM duty ratio.

Duty ratio limits and anti-windup should be applied.

The PWM signal is generated using the microcontroller PWM/ePWM peripheral.

Protection functions include over-voltage, over-current, short-circuit and over-temperature protection.

PIL testing executes the controller code on the target processor while the converter or plant is simulated.

Efficiency is calculated from output power divided by input power.

Thermal performance is evaluated by measuring device temperature and estimating losses and thermal resistance.`,

{
    id: 17,

    question:
    `A 72 V autonomous AGV uses a 2.16 kW BLDC motor for traction and a 12 V, 300 W auxiliary power system.

The auxiliary supply is obtained from the 72 V battery using a buck converter with an efficiency of 90%.

Answer the following:

a) Calculate the auxiliary output current.
b) Calculate the buck converter duty ratio.
c) Calculate the input power required by the auxiliary converter.
d) Calculate the battery-side current consumed by the auxiliary converter.
e) Explain the BLDC motor drive including the three-phase inverter, Hall sensors, six-step commutation and PWM control.
f) Explain how regenerative braking can be implemented using a bidirectional DC-DC converter.
g) Explain the digital PI control implementation using ADC and PWM.
h) Explain PIL testing for the controller.
i) Discuss converter efficiency, semiconductor losses, thermal design, EMI/EMC and protection requirements for the AGV.`,

    answer:

Battery voltage = 72 V
BLDC power = 2.16 kW
Auxiliary output voltage = 12 V
Auxiliary power = 300 W
Efficiency = 90%

a) Auxiliary output current:

Io = Po / Vo
Io = 300 / 12
Io = 25 A

b) Buck duty ratio:

D = Vo / Vin
D = 12 / 72
D = 0.1667
= 16.67%

c) Input power:

Pin = Po / η
Pin = 300 / 0.90
= 333.33 W

d) Battery-side current:

Iin = Pin / Vin
Iin = 333.33 / 72
= 4.63 A

e) BLDC drive:

The battery supplies the DC link of a three-phase inverter. Hall sensors detect rotor position. The controller uses the Hall signals to select the appropriate inverter switching sequence. Six-step electronic commutation energizes the correct two motor phases at a time. PWM controls the applied voltage and therefore controls speed and torque.

f) Regenerative braking:

During braking, the BLDC motor operates as a generator. Energy flows from the motor to the DC bus. A bidirectional DC-DC converter transfers the regenerative energy from the DC bus to the battery while controlling charging current and bus voltage.

g) Digital PI control:

The output voltage/current is sensed and converted by the ADC. The reference is compared with the measured value to generate error. The PI controller calculates the control signal. The signal is limited and converted into PWM duty ratio. The PWM peripheral drives the converter switches.

h) PIL:

The control algorithm is compiled and executed on the target controller processor while the power converter or motor plant is simulated. PIL verifies numerical behavior, execution and controller implementation.

i) Important considerations:

Efficiency must be calculated from output power and input power.

Semiconductor conduction and switching losses must be evaluated.

Thermal design requires heat sinks or suitable cooling and junction-temperature estimation.

EMI/EMC requires proper PCB layout, filtering, grounding, shielding and controlled switching transitions.

Protection should include over-current, over-voltage, under-voltage, short-circuit, over-temperature and battery protection.`,

/* =========================================================
   RENDER QUESTIONS
   ========================================================= */

function renderQuestions() {

    const container =
        document.getElementById("questionsContainer");

    let currentPart = "";

    QUESTIONS.forEach(q => {

        if (q.part !== currentPart) {

            currentPart = q.part;

            let title = "";

            if (currentPart === "Part A") {
                title = "PART A – Answer all questions";
            }

            if (currentPart === "Part B") {
                title = "PART B – Answer all questions";
            }

            if (currentPart === "Part C") {
                title = "PART C – Compulsory Question";
            }

            const partDiv =
                document.createElement("div");

            partDiv.className = "part-title";
            partDiv.innerText = title;

            container.appendChild(partDiv);
        }

        const questionDiv =
            document.createElement("div");

        questionDiv.className = "question";

        questionDiv.innerHTML = `

            <div class="question-text">
                Q${q.id}. ${q.question}
                <span class="marks">
                    [${q.marks} Marks]
                </span>
            </div>

            <textarea
                id="answer_${q.id}"
                placeholder="Enter your answer here...">
            </textarea>

            <div
                id="feedback_${q.id}"
                class="feedback">
            </div>
        `;

        container.appendChild(questionDiv);
    });
}


/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^\w\s.%+-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   EXTRACT NUMBERS
   ========================================================= */

function extractNumbers(text) {

    const matches =
        text.match(/[-+]?\d*\.?\d+/g);

    if (!matches) {
        return [];
    }

    return matches.map(Number);
}


/* =========================================================
   NUMBER CHECK
   ========================================================= */

function numberExists(studentNumbers, expected) {

    return studentNumbers.some(num => {

        if (Math.abs(expected) < 0.05) {
            return Math.abs(num - expected) < 0.05;
        }

        const tolerance =
            Math.max(Math.abs(expected) * 0.03, 0.05);

        return Math.abs(num - expected) <= tolerance;
    });
}


/* =========================================================
   EVALUATE SINGLE QUESTION
   ========================================================= */

function evaluateQuestion(q) {

    const textarea =
        document.getElementById("answer_" + q.id);

    const feedback =
        document.getElementById("feedback_" + q.id);

    const studentAnswer =
        textarea.value.trim();

    feedback.style.display = "block";

    if (!studentAnswer) {

        feedback.className = "feedback wrong";

        feedback.innerHTML =
            "<strong>Not Attempted</strong><br>" +
            "Marks obtained: 0 / " + q.marks;

        return {
            marks: 0,
            status: "NOT ATTEMPTED"
        };
    }

    /* ================= NUMERICAL ================= */

    if (q.numerical) {

        const numbers =
            extractNumbers(studentAnswer);

        let found = 0;

        q.numerical.forEach(expected => {

            if (numberExists(numbers, expected)) {
                found++;
            }

        });

        const ratio =
            found / q.numerical.length;

        let marks =
            Math.round(q.marks * ratio * 100) / 100;

        let status = "";

        if (marks === q.marks) {

            status = "CORRECT";

            feedback.className =
                "feedback correct";

            feedback.innerHTML =
                "<strong>Correct</strong><br>" +
                "Marks obtained: " +
                marks + " / " + q.marks;

        }
        else if (marks > 0) {

            status = "PARTIAL";

            feedback.className =
                "feedback partial";

            feedback.innerHTML =
                "<strong>Partially Correct</strong><br>" +
                "Numerical values identified: " +
                found + " / " +
                q.numerical.length +
                "<br>Marks obtained: " +
                marks + " / " + q.marks;

        }
        else {

            status = "WRONG";

            feedback.className =
                "feedback wrong";

            feedback.innerHTML =
                "<strong>Wrong</strong><br>" +
                "Expected numerical values were not identified." +
                "<br>Marks obtained: 0 / " +
                q.marks;
        }

        return {
            marks: marks,
            status: status
        };
    }


    /* ================= THEORY ================= */

    const answer =
        normalize(studentAnswer);

    let foundKeywords = 0;

    q.keywords.forEach(keyword => {

        if (answer.includes(normalize(keyword))) {
            foundKeywords++;
        }

    });

    const keywordRatio =
        foundKeywords / q.keywords.length;

    let marks =
        Math.round(
            q.marks *
            Math.min(keywordRatio, 1) *
            100
        ) / 100;

    /*
       Give minimum partial credit when
       the student has demonstrated relevant
       content.
    */

    if (foundKeywords >= 2 && marks === 0) {
        marks = Math.min(1, q.marks);
    }

    let status = "";

    if (marks >= q.marks * 0.8) {

        status = "CORRECT";

        feedback.className =
            "feedback correct";

        feedback.innerHTML =
            "<strong>Good Answer</strong><br>" +
            "Relevant concepts identified: " +
            foundKeywords +
            " / " +
            q.keywords.length +
            "<br>Marks obtained: " +
            marks +
            " / " +
            q.marks;

    }
    else if (marks > 0) {

        status = "PARTIAL";

        feedback.className =
            "feedback partial";

        feedback.innerHTML =
            "<strong>Partially Correct</strong><br>" +
            "Relevant concepts identified: " +
            foundKeywords +
            " / " +
            q.keywords.length +
            "<br>Marks obtained: " +
            marks +
            " / " +
            q.marks;

    }
    else {

        status = "WRONG";

        feedback.className =
            "feedback wrong";

        feedback.innerHTML =
            "<strong>Needs Improvement</strong><br>" +
            "Important concepts were not identified." +
            "<br>Marks obtained: 0 / " +
            q.marks;
    }

    return {
        marks: marks,
        status: status
    };
}


/* =========================================================
   EVALUATE ALL ANSWERS
   ========================================================= */

function evaluateAnswers() {

    let total = 0;
    let attempted = 0;
    let correct = 0;

    const resultTable =
        document.getElementById("resultTable");

    resultTable.innerHTML = "";

    QUESTIONS.forEach(q => {

        const result =
            evaluateQuestion(q);

        total += result.marks;

        if (result.status !== "NOT ATTEMPTED") {
            attempted++;
        }

        if (result.status === "CORRECT") {
            correct++;
        }

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td>Q${q.id}</td>
            <td>${q.marks}</td>
            <td>${result.marks}</td>
            <td>${result.status}</td>
        `;

        resultTable.appendChild(row);
    });

    total =
        Math.round(total * 100) / 100;

    const percentage =
        Math.round((total / 130) * 10000) / 100;

    document.getElementById("totalMarks")
        .innerText = total + " / 130";

    document.getElementById("percentage")
        .innerText = percentage + "%";

    document.getElementById("attempted")
        .innerText =
        attempted + " / " + QUESTIONS.length;

    document.getElementById("correct")
        .innerText = correct;

    document.getElementById("result")
        .style.display = "block";

    window.scrollTo({
        top:
        document.getElementById("result").offsetTop - 20,
        behavior: "smooth"
    });
}


/* =========================================================
   SHOW ANSWER KEY
   ========================================================= */

function showAnswerKey() {

    const key =
        document.getElementById("answerKey");

    const content =
        document.getElementById("answerKeyContent");

    content.innerHTML = "";

    QUESTIONS.forEach(q => {

        const item =
            document.createElement("div");

        item.className = "answer-item";

        item.innerHTML = `
            <strong>Q${q.id} [${q.marks} Marks]</strong>
            <br><br>
            ${q.answer.replace(/\n/g, "<br>")}
        `;

        content.appendChild(item);
    });

    key.style.display = "block";

    key.scrollIntoView({
        behavior: "smooth"
    });
}


/* =========================================================
   INITIALIZE
   ========================================================= */

renderQuestions();
