b) Input power:

Pin = Pout / η

Pin = 480 / 0.92

Pin ≈ 521.74 W

c) Input current:

Iin = Pin / Vin

Iin ≈ 10.87 A

b) DC-DC converters
c) DC-AC converters
d) AC-AC converters
e) Converter selection criteria

1. AC-DC converters – convert AC supply to DC.
2. DC-DC converters – convert one DC voltage level to another.
3. DC-AC converters – convert DC into controlled AC.
4. AC-AC converters – convert one AC voltage/frequency to another.

Converter selection depends on:

- Input and output voltage
- Power rating
- Efficiency
- Switching frequency
- Isolation
- Size
- Cost
- Dynamic response
- Reliability

EMI/EMC considerations include filtering, shielding, grounding, PCB layout and controlled switching transitions.

Thermal considerations include conduction loss, switching loss, heat-sink selection, cooling and junction-temperature limits.`,

D = |Vo| / (Vin + |Vo|)

D = 24 / (18 + 24)

A bidirectional converter allows energy flow in both directions and is useful for battery charging and regenerative braking.`,

Forward rotation is obtained by turning ON the appropriate diagonal pair of switches.

Reverse rotation is obtained by turning ON the opposite diagonal pair.

PWM is used to control the average motor voltage and speed.

Braking can be achieved by dynamic braking or controlled regenerative braking.

A BLDC drive uses a three-phase inverter.

Hall sensors provide rotor position information.

The controller uses Hall sensor signals to determine the correct six-step commutation sequence.

PWM controls the effective motor voltage and current, thereby controlling motor speed and torque.`,

b) Voltage-mode control
c) Current-mode control
d) Digital implementation using a microcontroller
e) PIL testing
f) Efficiency measurement
g) Ripple measurement

    answer:

The proportional term responds to present error.

The integral term accumulates error and reduces steady-state error.

The derivative term responds to the rate of change of error.

In voltage-mode control, the output voltage is compared with the reference and the controller adjusts the PWM duty ratio.

In current-mode control, current feedback is additionally used.

Digital control uses sensors, ADCs, a microcontroller and PWM peripherals.

PIL testing executes controller code on the target processor while the plant is simulated.

Efficiency is measured from input and output power.

Voltage and current ripple can be measured using suitable sensors or oscilloscopes.

Thermal testing involves measuring component temperatures and evaluating power losses and heat-sink performance.`,

f) Explain PWM-based speed and torque control.
g) Explain regenerative braking and energy recovery.
h) Explain digital PI/PID control implementation.
i) Explain PIL testing.
j) Discuss converter efficiency, semiconductor losses, thermal design, EMI/EMC and reliability.`,

Battery voltage = 48 V
BLDC motor power = 1 kW
Auxiliary voltage = 12 V
Auxiliary power = 120 W
Converter efficiency = 90% = 0.90

a) Auxiliary output current:

Io = Po / Vo

D = 0.25

D = 25%

Pin = Po / η

Pin = 120 / 0.90

Pin = 133.33 W

d) Battery input current:

Iin = Pin / Vin

Iin = 133.33 / 48

Iin ≈ 2.78 A

e) BLDC drive:

The 48 V battery supplies the DC link of a three-phase inverter.

Hall sensors detect rotor position.

The controller uses the Hall signals to select the appropriate six-step commutation sequence.

The inverter switches energize the appropriate motor phases.

f) PWM control:

PWM changes the effective voltage applied to the BLDC motor.

Changing the PWM duty ratio controls motor current, speed and torque.

g) Regenerative braking:

During regenerative braking the BLDC motor operates as a generator.

Mechanical energy is converted into electrical energy.

The recovered energy is transferred to the DC bus and can be returned to the battery using a bidirectional converter.

h) Digital PI/PID control:

Voltage, current or speed is sensed.

The signal is converted using an ADC.

The reference is compared with the measured value.

The error is processed by the PI/PID controller.

The controller output is converted into a PWM duty ratio.

The PWM peripheral generates the switching pulses.

i) PIL testing:

The controller software executes on the target processor while the converter/motor plant is simulated.

PIL verifies controller implementation and processor execution.

j) Performance and reliability:

Efficiency is calculated from output power and input power.

Conduction and switching losses must be evaluated.

Thermal design includes heat sinks and junction-temperature estimation.

EMI/EMC requires filtering, shielding, grounding and proper PCB layout.

Reliability requires over-current, over-voltage, under-voltage, short-circuit and over-temperature protection.`,

    let currentPart = "";

    QUESTIONS.forEach(q => {

        if (q.part !== currentPart) {

            currentPart = q.part;

            let title = "";

            if (currentPart === "Part A") {

                title =
                "PART A – Answer all questions";
            }

            else if (currentPart === "Part B") {

                title =
                "PART B – Answer all questions";
            }

            else {

                title =
                "PART C – Compulsory Question";
            }


            const partDiv =
                document.createElement("div");

            partDiv.className =
                "part-title";

            partDiv.innerText =
                title;

            container.appendChild(
                partDiv
            );
        }


        const questionDiv =
            document.createElement("div");

        questionDiv.className =
            "question";


        questionDiv.innerHTML = `

            <div class="question-text">

                Q${q.id}. ${q.question}

                <span class="marks">
                    [${q.marks} Marks]
                </span>

            </div>


            <textarea
                id="answer_${q.id}"
                placeholder="Enter your answer here...">
            </textarea>


            <div
                id="feedback_${q.id}"
                class="feedback">
            </div>

        `;


        container.appendChild(
            questionDiv
        );
    });
}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^\w\s.%+-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   EXTRACT NUMBERS
========================================================= */

function extractNumbers(text) {

    const matches =
        text.match(/[-+]?\d*\.?\d+/g);

    if (!matches) {

        return [];
    }

    return matches.map(Number);
}


/* =========================================================
   NUMBER CHECK
   3% tolerance
========================================================= */

function numberExists(
    studentNumbers,
    expected
) {

    return studentNumbers.some(num => {

        if (
            Math.abs(expected) < 0.05
        ) {

            return (
                Math.abs(
                    num - expected
                ) < 0.05
            );
        }


        const tolerance =
            Math.max(
                Math.abs(expected) * 0.03,
                0.05
            );


        return (
            Math.abs(
                num - expected
            ) <= tolerance
        );
    });
}


/* =========================================================
   EVALUATE SINGLE QUESTION
========================================================= */

function evaluateQuestion(q) {

    const textarea =
        document.getElementById(
            "answer_" + q.id
        );

    const feedback =
        document.getElementById(
            "feedback_" + q.id
        );


    const studentAnswer =
        textarea.value.trim();


    feedback.style.display =
        "block";


    /* =====================================================
       BLANK ANSWER
    ===================================================== */

    if (!studentAnswer) {

        feedback.className =
            "feedback wrong";

        feedback.innerHTML =
            "<strong>Not Attempted</strong><br>" +
            "Marks obtained: 0 / " +
            q.marks;


        return {
            marks: 0,
            status: "NOT ATTEMPTED"
        };
    }


    /* =====================================================
       NUMERICAL QUESTION
    ===================================================== */

    if (q.numerical) {

        const numbers =
            extractNumbers(
                studentAnswer
            );


        let found = 0;


        q.numerical.forEach(
            expected => {

                if (
                    numberExists(
                        numbers,
                        expected
                    )
                ) {

                    found++;
                }
            }
        );


        const ratio =
            found /
            q.numerical.length;


        let marks =
            Math.round(
                q.marks *
                ratio *
                100
            ) / 100;


        let status;


        if (
            marks === q.marks
        ) {

            status = "CORRECT";

            feedback.className =
                "feedback correct";

            feedback.innerHTML =
                "<strong>Correct</strong><br>" +
                "Numerical values identified: " +
                found +
                " / " +
                q.numerical.length +
                "<br>Marks obtained: " +
                marks +
                " / " +
                q.marks;
        }


        else if (
            marks > 0
        ) {

            status = "PARTIAL";

            feedback.className =
                "feedback partial";

            feedback.innerHTML =
                "<strong>Partially Correct</strong><br>" +
                "Numerical values identified: " +
                found +
                " / " +
                q.numerical.length +
                "<br>Marks obtained: " +
                marks +
                " / " +
                q.marks;
        }


        else {

            status = "WRONG";

            feedback.className =
                "feedback wrong";

            feedback.innerHTML =
                "<strong>Wrong</strong><br>" +
                "Required numerical values were not identified." +
                "<br>Marks obtained: 0 / " +
                q.marks;
        }


        return {
            marks: marks,
            status: status
        };
    }


    /* =====================================================
       THEORY QUESTION
    ===================================================== */

    const answer =
        normalize(
            studentAnswer
        );


    let foundKeywords = 0;


    q.keywords.forEach(
        keyword => {

            if (
                answer.includes(
                    normalize(keyword)
                )
            ) {

                foundKeywords++;
            }

        }
    );


    const keywordRatio =
        foundKeywords /
        q.keywords.length;


    let marks =
        Math.round(
            q.marks *
            Math.min(
                keywordRatio,
                1
            ) *
            100
        ) / 100;


    if (
        foundKeywords >= 2 &&
        marks === 0
    ) {

        marks =
            Math.min(
                1,
                q.marks
            );
    }


    let status;


    if (
        marks >=
        q.marks * 0.8
    ) {

        status = "CORRECT";

        feedback.className =
            "feedback correct";

        feedback.innerHTML =
            "<strong>Good Answer</strong><br>" +
            "Relevant concepts identified: " +
            foundKeywords +
            " / " +
            q.keywords.length +
            "<br>Marks obtained: " +
            marks +
            " / " +
            q.marks;
    }


    else if (
        marks > 0
    ) {

        status = "PARTIAL";

        feedback.className =
            "feedback partial";

        feedback.innerHTML =
            "<strong>Partially Correct</strong><br>" +
            "Relevant concepts identified: " +
            foundKeywords +
            " / " +
            q.keywords.length +
            "<br>Marks obtained: " +
            marks +
            " / " +
            q.marks;
    }


    else {

        status = "WRONG";

        feedback.className =
            "feedback wrong";

        feedback.innerHTML =
            "<strong>Needs Improvement</strong><br>" +
            "Important concepts were not identified." +
            "<br>Marks obtained: 0 / " +
            q.marks;
    }


    return {
        marks: marks,
        status: status
    };
}


/* =========================================================
   EVALUATE ALL ANSWERS
========================================================= */

function evaluateAnswers() {

    let total = 0;

    let attempted = 0;

    let correct = 0;


    const resultTable =
        document.getElementById(
            "resultTable"
        );


    resultTable.innerHTML = "";


    QUESTIONS.forEach(q => {

        const result =
            evaluateQuestion(q);


        total +=
            result.marks;


        if (
            result.status !==
            "NOT ATTEMPTED"
        ) {

            attempted++;
        }


        if (
            result.status ===
            "CORRECT"
        ) {

            correct++;
        }


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>Q${q.id}</td>

            <td>${q.marks}</td>

            <td>${result.marks}</td>

            <td>${result.status}</td>

        `;


        resultTable.appendChild(
            row
        );

    });


    total =
        Math.round(
            total * 100
        ) / 100;


    const percentage =
        Math.round(
            (total / 130) *
            10000
        ) / 100;


    document.getElementById(
        "totalMarks"
    ).innerText =
        total + " / 130";


    document.getElementById(
        "percentage"
    ).innerText =
        percentage + "%";


    document.getElementById(
        "attempted"
    ).innerText =
        attempted +
        " / " +
        QUESTIONS.length;


    document.getElementById(
        "correct"
    ).innerText =
        correct;


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior: "smooth"
    });
}


/* =========================================================
   SHOW ANSWER KEY
========================================================= */

function showAnswerKey() {

    const key =
        document.getElementById(
            "answerKey"
        );


    const content =
        document.getElementById(
            "answerKeyContent"
        );


    content.innerHTML = "";


    QUESTIONS.forEach(q => {

        const item =
            document.createElement("div");


        item.className =
            "answer-item";


        item.innerHTML = `

            <strong>
                Q${q.id}
                [${q.marks} Marks]
            </strong>

            <br><br>

            ${q.answer.replace(
                /\n/g,
                "<br>"
            )}

        `;


        content.appendChild(
            item
        );

    });


    key.style.display =
        "block";


    key.scrollIntoView({
        behavior: "smooth"
    });
}
