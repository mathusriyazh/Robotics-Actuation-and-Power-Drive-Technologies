Capacity = 20 Ah
P = 388.5 W

E = V × Ah

t = E / P

t = 518 / 388.5

t ≈ 1.33 h

c) Average battery current:

I = P / V

I = 388.5 / 25.9

I = 15 A

d) C-rate:

C-rate = Current / Capacity

C-rate = 15 / 20

= 0.75 C

e) Battery selection factors:

- Voltage

- Power density
- C-rate

- Charging time

{

b) DC-link capacitor

    answer:

A DC-link capacitor stabilizes the DC-bus voltage and absorbs switching ripple.

DC-DC converters generate regulated voltages for controllers, sensors, actuators and other subsystems.

DC-AC inverters supply variable voltage and frequency to AC motors or generate controlled phase voltages for motor drives.

Isolation may be required between power and sensitive control circuits for safety and noise reduction.

EMI/EMC considerations include filtering, shielding, grounding, proper PCB layout, short current paths and controlled switching transitions.

Protection includes over-current, over-voltage, under-voltage, short-circuit and over-temperature protection.

Reliability requires proper thermal management, component derating and fault monitoring.`,

Output voltage = 15 V
Output current = 4 A
Switching frequency = 60 kHz

Assume:

Inductor ripple current = 30% of output current
Output voltage ripple = 1% of output voltage

Calculate:

a) Output power
b) Duty ratio
c) Inductor ripple current
d) Inductance
e) Output voltage ripple
f) Approximate output capacitance.`,

    answer:
`Given:

Vin = 45 V
Vo = 15 V
Io = 4 A
fs = 60 kHz

a) Output power:

Po = Vo × Io

Po = 15 × 4

Po = 60 W

b) Duty ratio:

D = Vo / Vin

D = 15 / 45

D = 0.3333

D = 33.33%

c) Inductor ripple current:

ΔIL = 30% × Io

ΔIL = 0.30 × 4

ΔIL = 1.2 A

d) Inductance:

L = [(Vin - Vo)D] / (fs × ΔIL)

L = [(45 - 15) × 0.3333] /
    (60000 × 1.2)

L ≈ 138.89 µH

e) Output voltage ripple:

ΔVo = 1% × 15

ΔVo = 0.15 V

f) Approximate capacitance:

C = ΔIL / (8fsΔVo)

C = 1.2 /
    (8 × 60000 × 0.15)

An LC filter reduces output voltage ripple.

A feedback circuit senses the output voltage and regulates the PWM duty ratio.

Protection should include over-current, short-circuit, over-voltage and over-temperature protection.

EMI/EMC is controlled using proper transformer design, filtering, grounding, shielding, PCB layout and controlled switching.`,

b) Three-phase inverter
c) Hall sensor feedback
d) Electronic commutation
e) PWM speed control
f) Torque production
g) Current limiting and protection.`,

    answer:

A three-phase inverter consisting of six semiconductor switches supplies controlled current to the motor windings.

Hall sensors provide rotor position information.

The controller uses the Hall sensor states to select the appropriate switching sequence.

Six-step electronic commutation energizes the required motor phases in sequence.

PWM controls the effective motor voltage and current and therefore controls speed and torque.

Motor torque is produced by interaction between stator magnetic field and rotor permanent-magnet field.

Current limiting protects the motor, inverter and battery during high-load or starting conditions.

Additional protection includes over-current, over-voltage, under-voltage, shoot-through and over-temperature protection.`,

The analog signal is sampled by the ADC of the microcontroller.

The measured voltage is compared with the reference voltage to calculate the control error.

The digital PI controller processes the error and produces the control command.

The controller output is limited to a safe duty-ratio range.

The PWM/ePWM peripheral generates the switching pulse.

Protection functions monitor voltage, current and temperature.

PIL testing executes the control algorithm on the target processor while the plant remains in simulation.

Efficiency is calculated using output power and input power.

Thermal performance is evaluated by measuring semiconductor temperature and estimating power losses and thermal resistance.`,

{

    question:
`A 60 V autonomous warehouse robot uses a 1.8 kW BLDC traction motor and a 15 V, 225 W auxiliary power supply.

The auxiliary supply is obtained from the 60 V battery through a buck converter operating at 92% efficiency.

Answer the following:

a) Calculate the auxiliary output current.
b) Calculate the ideal buck converter duty ratio.
c) Calculate the input power required by the auxiliary converter.
d) Calculate the battery-side current drawn by the auxiliary converter.
e) Explain the BLDC drive using a three-phase inverter, Hall sensors, six-step commutation and PWM.
f) Explain regenerative braking and energy transfer to the battery.
g) Explain the role of a bidirectional DC-DC converter in regenerative operation.
h) Explain digital PI control using ADC and PWM.
i) Explain PIL testing.
j) Discuss converter efficiency, conduction loss, switching loss, thermal design, EMI/EMC and protection.`,

    answer:
`Given:

Battery voltage = 60 V
BLDC motor power = 1.8 kW
Auxiliary output voltage = 15 V
Auxiliary power = 225 W
Converter efficiency = 92%

a) Auxiliary output current:

Io = Po / Vo

Io = 225 / 15

Io = 15 A

b) Buck duty ratio:

D = Vo / Vin

D = 15 / 60

D = 0.25

D = 25%

c) Input power:

Pin = Po / η

Pin = 225 / 0.92

Pin ≈ 244.57 W

d) Battery-side current:

Iin = Pin / Vin

Iin = 244.57 / 60

Iin ≈ 4.08 A

e) BLDC drive:

The battery supplies the DC link of the three-phase inverter. Hall sensors detect rotor position. The controller uses the Hall sensor signals to select the proper six-step commutation sequence. PWM controls the inverter switches and controls motor speed and torque.

f) Regenerative braking:

During braking the BLDC motor operates as a generator. Mechanical energy is converted into electrical energy and transferred to the DC bus. The recovered energy can be transferred to the battery.

g) Bidirectional converter:

A bidirectional DC-DC converter allows power to flow in both directions. During motoring it can support the DC bus from the battery. During regenerative braking it transfers energy from the DC bus back toward the battery while controlling charging current and voltage.

h) Digital PI control:

The output is sensed and converted using the ADC. The measured value is compared with the reference. The error is processed by the digital PI controller. The output is limited and converted into PWM duty ratio. The PWM/ePWM peripheral generates the switching signal.

i) PIL:

The controller code is executed on the target processor while the motor/converter plant is simulated. PIL verifies the implementation, numerical behavior and processor execution.

j) Performance and protection:

Efficiency is calculated from output power and input power.

Conduction losses and switching losses must be estimated for the semiconductor devices.

Thermal design requires suitable heat sinks or cooling and junction-temperature estimation.

EMI/EMC is addressed using proper PCB layout, filtering, grounding, shielding and controlled switching.

Protection should include over-current, over-voltage, under-voltage, short-circuit, shoot-through and over-temperature protection.`,

    let currentPart = "";

            currentPart = q.part;

            }

            if (currentPart === "Part C") {
                title = "PART C – Compulsory Question";
            }

            const partDiv =
                document.createElement("div");

            partDiv.className = "part-title";
            partDiv.innerText = title;

            container.appendChild(partDiv);
        }

        const questionDiv =
            document.createElement("div");

        questionDiv.className = "question";

        questionDiv.innerHTML = `

            <div class="question-text">
                Q${q.id}. ${q.question}
                <span class="marks">
                    [${q.marks} Marks]
                </span>
            </div>

            <textarea
                id="answer_${q.id}"
                placeholder="Enter your answer here..."></textarea>

            <div
                id="feedback_${q.id}"
                class="feedback">
            </div>
        `;

        container.appendChild(questionDiv);
    });
}


/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^\w\s.%+-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   EXTRACT NUMBERS
   ========================================================= */

function extractNumbers(text) {

    const matches =
        text.match(/[-+]?\d*\.?\d+/g);

    if (!matches) {
        return [];
    }

    return matches.map(Number);
}


/* =========================================================
   NUMBER CHECK WITH 3% TOLERANCE
   ========================================================= */

function numberExists(studentNumbers, expected) {

    return studentNumbers.some(num => {

        if (Math.abs(expected) < 0.05) {

            return Math.abs(num - expected) < 0.05;
        }

        const tolerance =
            Math.max(
                Math.abs(expected) * 0.03,
                0.05
            );

        return Math.abs(num - expected) <= tolerance;
    });
}


/* =========================================================
   EVALUATE SINGLE QUESTION
   ========================================================= */

function evaluateQuestion(q) {

    const textarea =
        document.getElementById("answer_" + q.id);

    const feedback =
        document.getElementById("feedback_" + q.id);

    const studentAnswer =
        textarea.value.trim();

    feedback.style.display = "block";


    if (!studentAnswer) {

        feedback.className =
            "feedback wrong";

        feedback.innerHTML =
            "<strong>Not Attempted</strong><br>" +
            "Marks obtained: 0 / " +
            q.marks;

        return {
            marks: 0,
            status: "NOT ATTEMPTED"
        };
    }


    /* =====================================================
       NUMERICAL EVALUATION
       ===================================================== */

    if (q.numerical) {

        const numbers =
            extractNumbers(studentAnswer);

        let found = 0;

        q.numerical.forEach(expected => {

            if (numberExists(numbers, expected)) {
                found++;
            }

        });

        const ratio =
            found / q.numerical.length;

        let marks =
            Math.round(
                q.marks *
                ratio *
                100
            ) / 100;

        let status;


        if (marks === q.marks) {

            status = "CORRECT";

            feedback.className =
                "feedback correct";

            feedback.innerHTML =
                "<strong>Correct</strong><br>" +
                "Numerical values identified: " +
                found + " / " +
                q.numerical.length +
                "<br>Marks obtained: " +
                marks + " / " +
                q.marks;
        }

        else if (marks > 0) {

            status = "PARTIAL";

            feedback.className =
                "feedback partial";

            feedback.innerHTML =
                "<strong>Partially Correct</strong><br>" +
                "Numerical values identified: " +
                found + " / " +
                q.numerical.length +
                "<br>Marks obtained: " +
                marks + " / " +
                q.marks;
        }

        else {

            status = "WRONG";

            feedback.className =
                "feedback wrong";

            feedback.innerHTML =
                "<strong>Wrong</strong><br>" +
                "Required numerical values were not identified." +
                "<br>Marks obtained: 0 / " +
                q.marks;
        }

        return {
            marks: marks,
            status: status
        };
    }


    /* =====================================================
       THEORY EVALUATION
       ===================================================== */

    const answer =
        normalize(studentAnswer);

    let foundKeywords = 0;

    q.keywords.forEach(keyword => {

        if (
            answer.includes(
                normalize(keyword)
            )
        ) {

            foundKeywords++;
        }

    });


    const keywordRatio =
        foundKeywords / q.keywords.length;


    let marks =
        Math.round(
            q.marks *
            Math.min(keywordRatio, 1) *
            100
        ) / 100;


    if (
        foundKeywords >= 2 &&
        marks === 0
    ) {

        marks = Math.min(1, q.marks);
    }


    let status;


    if (
        marks >= q.marks * 0.8
    ) {

        status = "CORRECT";

        feedback.className =
            "feedback correct";

        feedback.innerHTML =
            "<strong>Good Answer</strong><br>" +
            "Relevant concepts identified: " +
            foundKeywords +
            " / " +
            q.keywords.length +
            "<br>Marks obtained: " +
            marks +
            " / " +
            q.marks;
    }

    else if (marks > 0) {

        status = "PARTIAL";

        feedback.className =
            "feedback partial";

        feedback.innerHTML =
            "<strong>Partially Correct</strong><br>" +
            "Relevant concepts identified: " +
            foundKeywords +
            " / " +
            q.keywords.length +
            "<br>Marks obtained: " +
            marks +
            " / " +
            q.marks;
    }

    else {

        status = "WRONG";

        feedback.className =
            "feedback wrong";

        feedback.innerHTML =
            "<strong>Needs Improvement</strong><br>" +
            "Important concepts were not identified." +
            "<br>Marks obtained: 0 / " +
            q.marks;
    }


    return {
        marks: marks,
        status: status
    };
}


/* =========================================================
   EVALUATE ALL QUESTIONS
   ========================================================= */

function evaluateAnswers() {

    let total = 0;
    let attempted = 0;
    let correct = 0;

    const resultTable =
        document.getElementById("resultTable");

    resultTable.innerHTML = "";


    QUESTIONS.forEach(q => {

        const result =
            evaluateQuestion(q);

        total += result.marks;


        if (
            result.status !==
            "NOT ATTEMPTED"
        ) {

            attempted++;
        }


        if (
            result.status ===
            "CORRECT"
        ) {

            correct++;
        }


        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>Q${q.id}</td>

            <td>${q.marks}</td>

            <td>${result.marks}</td>

            <td>${result.status}</td>

        `;

        resultTable.appendChild(row);

    });


    total =
        Math.round(
            total * 100
        ) / 100;


    const percentage =
        Math.round(
            (total / 130) *
            10000
        ) / 100;


    document.getElementById(
        "totalMarks"
    ).innerText =
        total + " / 130";


    document.getElementById(
        "percentage"
    ).innerText =
        percentage + "%";


    document.getElementById(
        "attempted"
    ).innerText =
        attempted +
        " / " +
        QUESTIONS.length;


    document.getElementById(
        "correct"
    ).innerText =
        correct;


    document.getElementById(
        "result"
    ).style.display =
        "block";


    window.scrollTo({

        top:
        document.getElementById(
            "result"
        ).offsetTop - 20,

        behavior: "smooth"

    });
}


/* =========================================================
   SHOW ANSWER KEY
   ========================================================= */

function showAnswerKey() {

    const key =
        document.getElementById(
            "answerKey"
        );

    const content =
        document.getElementById(
            "answerKeyContent"
        );

    content.innerHTML = "";


    QUESTIONS.forEach(q => {

        const item =
            document.createElement("div");

        item.className =
            "answer-item";


        item.innerHTML = `

            <strong>
                Q${q.id}
                [${q.marks} Marks]
            </strong>

            <br><br>

            ${q.answer.replace(
                /\n/g,
                "<br>"
            )}

        `;


        content.appendChild(item);

    });


    key.style.display =
        "block";


    key.scrollIntoView({
        behavior: "smooth"
    });
}

renderQuestions();
