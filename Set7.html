/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^\w\s.%+-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================================================
   NUMBER DETECTION
========================================================= */

function containsNumber(text, expected) {

    const numbers =
        text.match(/-?\d+(\.\d+)?/g);


    if (!numbers) {
        return false;
    }


    return numbers.some(n => {

        const value =
            parseFloat(n);


        if (isNaN(value)) {
            return false;
        }


        const tolerance =
            Math.max(
                Math.abs(expected) * 0.03,
                0.05
            );


        return Math.abs(value - expected)
               <= tolerance;

    });

}


/* =========================================================
   KEYWORD DETECTION
========================================================= */

function containsKeyword(text, keyword) {

    return text.includes(
        keyword.toLowerCase()
    );

}


/* =========================================================
   EVALUATE ONE QUESTION
========================================================= */

function evaluateQuestion(q, studentAnswer) {

    const answer =
        normalize(studentAnswer);


    /* -------------------------
       EMPTY ANSWER
    ------------------------- */

    if (!answer) {

        return {
            marks: 0,
            status: "NOT ATTEMPTED",
            feedback: "No answer entered."
        };

    }


    /* -------------------------
       NUMERICAL
    ------------------------- */

    if (q.numerical) {

        let matched = 0;


        q.numerical.forEach(num => {

            if (
                containsNumber(
                    answer,
                    num
                )
            ) {
                matched++;
            }

        });


        const ratio =
            matched / q.numerical.length;


        let marks =
            Math.round(
                q.marks * ratio
            );


        let status;


        if (marks === q.marks) {
            status = "CORRECT";
        }

        else if (marks > 0) {
            status = "PARTIALLY CORRECT";
        }

        else {
            status = "WRONG";
        }


        return {

            marks: marks,

            status: status,

            feedback:
            `${matched} of ${q.numerical.length} expected numerical values identified.`

        };

    }


    /* -------------------------
       THEORY
    ------------------------- */

    let matchedKeywords = 0;


    q.keywords.forEach(keyword => {

        if (
            containsKeyword(
                answer,
                keyword
            )
        ) {
            matchedKeywords++;
        }

    });


    const ratio =
        matchedKeywords /
        q.keywords.length;


    let marks =
        Math.round(
            q.marks * ratio
        );


    if (
        matchedKeywords >= 2 &&
        marks === 0
    ) {
        marks = 1;
    }


    let status;


    if (marks >= q.marks) {
        status = "CORRECT";
    }

    else if (marks > 0) {
        status = "PARTIALLY CORRECT";
    }

    else {
        status = "WRONG";
    }


    return {

        marks: marks,

        status: status,

        feedback:
        `${matchedKeywords} relevant concepts identified out of ${q.keywords.length}.`

    };

}


/* =========================================================
   EVALUATE ALL ANSWERS
========================================================= */

function evaluateAnswers() {

    let totalMarks = 0;

    let attempted = 0;

    let correct = 0;

    let partial = 0;

    let wrong = 0;


    let resultHTML = `

        <h2>Question-wise Evaluation</h2>

        <table>

        <tr>
            <th>Question</th>
            <th>Maximum</th>
            <th>Marks</th>
            <th>Status</th>
            <th>Feedback</th>
        </tr>

    `;


    QUESTIONS.forEach(q => {

        const studentAnswer =
            document.getElementById(
                `answer_${q.id}`
            ).value;


        const result =
            evaluateQuestion(
                q,
                studentAnswer
            );


        totalMarks +=
            result.marks;


        if (
            studentAnswer.trim() !== ""
        ) {
            attempted++;
        }


        if (
            result.status === "CORRECT"
        ) {
            correct++;
        }

        else if (
            result.status ===
            "PARTIALLY CORRECT"
        ) {
            partial++;
        }

        else if (
            result.status === "WRONG"
        ) {
            wrong++;
        }


        const feedbackElement =
            document.getElementById(
                `feedback_${q.id}`
            );


        feedbackElement.innerHTML =
            `<b>${result.status}</b> – ${result.feedback}`;


        if (
            result.status === "CORRECT"
        ) {

            feedbackElement.className =
                "feedback correct";

        }

        else if (
            result.status ===
            "PARTIALLY CORRECT"
        ) {

            feedbackElement.className =
                "feedback partial";

        }

        else if (
            result.status === "WRONG"
        ) {

            feedbackElement.className =
                "feedback wrong";

        }

        else {

            feedbackElement.className =
                "feedback notattempted";

        }


        resultHTML += `

            <tr>

                <td>Q${q.id}</td>

                <td>${q.marks}</td>

                <td>${result.marks}</td>

                <td>${result.status}</td>

                <td style="text-align:left;">
                    ${result.feedback}
                </td>

            </tr>

        `;

    });


    resultHTML += `
        </table>
    `;


    const percentage =
        (
            totalMarks / 130 * 100
        ).toFixed(2);


    const studentName =
        document.getElementById(
            "studentName"
        ).value ||
        "Not entered";


    const registerNo =
        document.getElementById(
            "registerNo"
        ).value ||
        "Not entered";


    const className =
        document.getElementById(
            "className"
        ).value ||
        "Not entered";


    resultHTML = `

        <h2>Student Performance</h2>

        <table>

            <tr>
                <th>Student</th>
                <td>${studentName}</td>
            </tr>

            <tr>
                <th>Register Number</th>
                <td>${registerNo}</td>
            </tr>

            <tr>
                <th>Class / Section</th>
                <td>${className}</td>
            </tr>

        </table>


        <table>

            <tr>
                <th>Total Marks</th>
                <th>Percentage</th>
                <th>Attempted</th>
                <th>Correct</th>
                <th>Partial</th>
                <th>Wrong</th>
            </tr>

            <tr>

                <td>
                    <b>${totalMarks} / 130</b>
                </td>

                <td>
                    <b>${percentage}%</b>
                </td>

                <td>${attempted}</td>

                <td>${correct}</td>

                <td>${partial}</td>

                <td>${wrong}</td>

            </tr>

        </table>

        ${resultHTML}

    `;


    const resultBox =
        document.getElementById(
            "result"
        );


    resultBox.innerHTML =
        resultHTML;


    resultBox.style.display =
        "block";


    resultBox.scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================================================
   SHOW ANSWER KEY
========================================================= */

function showAnswerKey() {

    const answerKey =
        document.getElementById(
            "answerKey"
        );


    const answerContent =
        document.getElementById(
            "answerContent"
        );


    answerContent.innerHTML = "";


    QUESTIONS.forEach(q => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "answer-item";


        div.innerHTML = `

            <strong>
                Q${q.id}. [${q.marks} Marks]
            </strong>

            <div style="white-space:pre-line;">
                ${q.answer}
            </div>

            <hr>

        `;


        answerContent.appendChild(div);

    });


    answerKey.style.display =
        "block";


    answerKey.scrollIntoView({
        behavior: "smooth"
    });

}

renderQuestions();
